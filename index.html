<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pokalschießen</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f1f2f4;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:#1d1f22;color:#fff;padding:20px 16px;text-align:center} header h1{margin:0;font-size:27px} header p{margin:4px 0 0;opacity:.8}
main{max-width:760px;margin:auto;padding:16px} .card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 3px 15px #0001}
label{display:block;font-weight:650;margin:12px 0} input,select{width:100%;min-height:48px;margin-top:7px;padding:10px 12px;border:1px solid #c9c9c9;border-radius:10px;background:#fff;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px} .sets{margin-top:10px;padding:16px;border:1px solid #ddd;border-radius:14px;background:#fafafa} .sets h3{margin:8px 0 2px}
button{min-height:50px;border:0;border-radius:11px;padding:0 18px;font-size:17px;font-weight:700;background:#438f46;color:#fff} #make{width:100%;margin-top:14px}
.hidden{display:none!important} #printHost{display:none!important} .preview-modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;flex-direction:column} .preview-toolbar{background:#1d1f22;color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px} .preview-actions{display:flex;gap:8px} .preview-actions button{min-height:44px;font-size:15px} .close-btn{background:#505257}
.preview-content{flex:1;overflow:auto;padding:16px 8px} #out{width:100%;margin:auto;display:flex;justify-content:center} .sheet{width:1452px;height:2054px;background:#fff;position:relative;overflow:hidden;transform-origin:top center;flex:0 0 1452px}
.template{position:absolute;inset:0;width:1452px;height:2054px;z-index:1} .dyn{position:absolute;z-index:3;color:#111;white-space:nowrap} .value{font-size:20px;line-height:1.05} .heading{font-size:24px;font-weight:800;line-height:1} .kind{font-size:24px;font-weight:800;line-height:1} .smallnum{font-size:16px;line-height:1;text-align:center}.editable{outline:2px dashed #1683ff!important;outline-offset:3px;cursor:move;touch-action:none}.pos-label{position:absolute;z-index:10;background:#1683ff;color:#fff;font-size:12px;padding:2px 5px;border-radius:4px;pointer-events:none}
@media(max-width:700px){.grid{grid-template-columns:1fr} .preview-content{padding:8px 0} .preview-actions button{padding:0 12px;font-size:14px}}
@media print{
@page{size:A4 portrait;margin:0}
html,body{margin:0!important;padding:0!important;width:210mm!important;height:297mm!important;background:#fff!important;overflow:hidden!important;break-after:avoid!important;page-break-after:avoid!important}

#printHost{display:block!important;position:fixed!important;left:0!important;top:0!important;width:210mm!important;height:297mm!important;max-width:210mm!important;max-height:297mm!important;overflow:hidden!important;background:#fff!important;margin:0!important;padding:0!important;break-after:avoid!important;page-break-after:avoid!important}
#printHost svg{display:block!important;position:absolute!important;left:0!important;top:0!important;width:210mm!important;height:297mm!important;max-width:210mm!important;max-height:297mm!important;margin:0!important;padding:0!important;border:0!important;break-after:avoid!important;page-break-after:avoid!important}
}</style></head><body>
<header><h1>🎯 Pokalschießen</h1><p>Schießzettel erstellen</p></header><main><section class="card"><h2>Schießzettel</h2>
<label>Verein<input id="verein" placeholder="z. B. Badenstedt"></label><div class="grid"><label>Geschlecht<select id="mannschaft"><option>Herren</option><option>Damen</option></select></label><label>Telefon<input id="telefon" type="tel" inputmode="tel"></label></div>
<div class="sets"><h3>Satz 1</h3><label>Schießart<select id="art1"><option value="">Bitte auswählen</option><option>Sandsack</option><option>Nagel</option></select></label><label>Erste Scheibennummer für Satz 1<input id="start1" type="number" inputmode="numeric" min="1"></label>
<h3>Satz 2</h3><label>Schießart<select id="art2"><option value="">Bitte auswählen</option><option>Sandsack</option><option>Nagel</option></select></label><label>Erste Scheibennummer für Satz 2<input id="start2" type="number" inputmode="numeric" min="1"></label></div>
<button id="make" type="button">Schießzettel erstellen</button></section></main>

  o+=text('heading2',p.heading2[0],p.heading2[1],'heading',m);
  o+=text('kind2',p.kind2[0],p.kind2[1],'kind',a2);

  [['n11',n1[0]],['n12',n1[1]],['n13',n1[2]]].forEach(([id,v])=>{
    o+=center(id,p[id][0],p[id][1],100,'smallnum',v);
  });
  [['n21',n2[0]],['n22',n2[1]],['n23',n2[2]]].forEach(([id,v])=>{
    o+=center(id,p[id][0],p[id][1],100,'smallnum',v);
  });
  o+=center('n14',p.n14[0],p.n14[1],100,'smallnum',s1+3);
  o+=center('n24',p.n24[0],p.n24[1],100,'smallnum',s2+3);
  o+='</article>';
  $('out').innerHTML=o;
  $('previewModal').classList.remove('hidden');
  document.body.style.overflow='hidden';
  fit();
  if(editMode) enableDragging();
}
function fit(){
  const c=document.querySelector('.preview-content'),s=document.querySelector('.sheet');
  if(!c||!s)return;
  const scale=Math.min((c.clientWidth-8)/1452,(c.clientHeight-8)/2054,1);
  s.style.transform=`scale(${scale})`;
  document.getElementById('out').style.height=(2054*scale)+'px';
}
function enableDragging(){
  document.querySelectorAll('[data-pos]').forEach(el=>{
    el.classList.add('editable');
    el.onpointerdown=(ev)=>{
      ev.preventDefault();
      const id=el.dataset.pos, sheet=document.querySelector('.sheet');
      const rect=sheet.getBoundingClientRect();
      const scale=rect.width/1452;
      const startX=ev.clientX, startY=ev.clientY;
      const ox=positions[id][0], oy=positions[id][1];
      el.setPointerCapture?.(ev.pointerId);
      const move=(e)=>{
        positions[id]=[ox+(e.clientX-startX)/scale, oy+(e.clientY-startY)/scale];
        el.style.left=positions[id][0]+'px';
        el.style.top=positions[id][1]+'px';
      };
      const up=()=>{
        savePos();
        el.releasePointerCapture?.(ev.pointerId);
        el.removeEventListener('pointermove',move);
        el.removeEventListener('pointerup',up);
      };
      el.addEventListener('pointermove',move);
      el.addEventListener('pointerup',up);
    };
  });
}
function setEditMode(on){
  editMode=on;
  $('editPos').textContent=on?'✅ Positionen speichern':'📍 Positionen bearbeiten';
  if(on) enableDragging();
  else document.querySelectorAll('[data-pos]').forEach(el=>el.classList.remove('editable'));
}
window.addEventListener('resize',fit);
$('make').addEventListener('click',render);
$('close').addEventListener('click',()=>{
  $('previewModal').classList.add('hidden');
  document.body.style.overflow='';
});
$('print').addEventListener('click',async()=>{
  const source=document.querySelector('#out .sheet');
  if(!source) return;
  let host=document.getElementById('printHost'); if(host) host.remove();
  host=document.createElement('div'); host.id='printHost';
  const p=positions;
  const verein=$('verein').value.trim(), telefon=$('telefon').value.trim(), m=$('mannschaft').value, a1=$('art1').value, a2=$('art2').value;
  const s1=Number($('start1').value), s2=Number($('start2').value), n1=[s1,s1+1,s1+2], n2=[s2,s2+1,s2+2];
  const escSvg=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;');
  const t=(x,y,size,weight,val)=>`<text x="${x}" y="${y+size*0.82}" font-family="Arial,Helvetica,sans-serif" font-size="${size}px" font-weight="${weight}" fill="#111">${escSvg(val)}</text>`;
  const c=(x,y,size,val)=>`<text x="${x+50}" y="${y+size*0.82}" font-family="Arial,Helvetica,sans-serif" font-size="${size}px" text-anchor="middle" fill="#111">${escSvg(val)}</text>`;
  host.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 1452 2054">
    <image x="0" y="0" width="1452" height="2054" href="${IMG}" preserveAspectRatio="none"/>
    ${t(p.verein[0],p.verein[1],20,400,verein)}${t(p.telefon[0],p.telefon[1],20,400,telefon)}
    ${t(p.heading1[0],p.heading1[1],24,800,m)}${t(p.kind1[0],p.kind1[1],24,800,a1)}
    ${t(p.heading2[0],p.heading2[1],24,800,m)}${t(p.kind2[0],p.kind2[1],24,800,a2)}
    ${c(p.n11[0],p.n11[1],16,n1[0])}${c(p.n12[0],p.n12[1],16,n1[1])}${c(p.n13[0],p.n13[1],16,n1[2])}
    ${c(p.n21[0],p.n21[1],16,n2[0])}${c(p.n22[0],p.n22[1],16,n2[1])}${c(p.n23[0],p.n23[1],16,n2[2])}
    ${c(p.n14[0],p.n14[1],16,s1+3)}${c(p.n24[0],p.n24[1],16,s2+3)}
  </svg>`;
  document.body.appendChild(host);
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  const cleanup=()=>{if(host&&host.parentNode)host.remove();window.removeEventListener('afterprint',cleanup)};
  window.addEventListener('afterprint',cleanup,{once:true}); window.print(); setTimeout(cleanup,15000);
});
</script></body></html>
