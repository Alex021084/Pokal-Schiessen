<header><h1>🎯 Pokalschießen</h1><p>Schießzettel erstellen</p></header>
<main>
<section class="card">
  <h2>Neue Mannschaft</h2>
  <label>Verein<input id="verein" placeholder="z. B. Badenstedt"></label>
  <div class="grid">
    <label>Mannschaft<select id="mannschaft"><option>Herren</option><option>Damen</option></select></label>
    <label>Telefon<input id="telefon" type="tel" inputmode="tel"></label>
  </div>
  <div class="sets">
    <h3>Satz 1</h3>
    <label>Schießart<select id="art1"><option value="">Bitte auswählen</option><option>Sandsack</option><option>Nagel</option></select></label>
    <div id="startWrap1" class="hidden"><label>Erste Scheibennummer für Satz 1<input id="start1" type="number" inputmode="numeric" placeholder="z. B. 4833" min="1"></label></div>
    <h3>Satz 2</h3>
    <label>Schießart<select id="art2"><option value="">Bitte auswählen</option><option>Sandsack</option><option>Nagel</option></select></label>
    <div id="startWrap2" class="hidden"><label>Erste Scheibennummer für Satz 2<input id="start2" type="number" inputmode="numeric" placeholder="z. B. 4840" min="1"></label></div>
    <p class="hint">Die Angaben aus der App werden an den vorgesehenen Stellen auf den Schießzettel übernommen.</p>
  </div>
  <button id="make" type="button">Schießzettel erstellen</button>
</section>

<div id="previewModal" class="preview-modal hidden" role="dialog" aria-modal="true" aria-label="Vorschau">
  <div class="preview-window">
    <div class="preview-toolbar">
      <strong>Pokalschießen – Vorschau</strong>
      <div class="preview-actions">
        <button id="print" type="button">🖨️ Drucken</button>
        <button id="closePreview" type="button" class="close-btn">Schließen</button>
      </div>
    </div>
    <div class="preview-content"><div id="out"></div></div>
  </div>
</div>
</main>

function make(){
  const verein=$('verein').value.trim(),telefon=$('telefon').value.trim(),mannschaft=$('mannschaft').value,art1=$('art1').value,art2=$('art2').value,s1=Number($('start1').value),s2=Number($('start2').value);
  if(!art1||!art2||!Number.isInteger(s1)||s1<1||!Number.isInteger(s2)||s2<1){alert('Bitte für beide Sätze die Schießart und die erste Scheibennummer eingeben.');return;}
  $('out').innerHTML=sheet({verein,telefon,mannschaft,art1,start1:s1,art2,start2:s2});
  const modal=$('previewModal');modal.classList.remove('hidden');modal.setAttribute('aria-hidden','false');document.body.classList.add('preview-open');
}
function closePreview(){const modal=$('previewModal');modal.classList.add('hidden');modal.setAttribute('aria-hidden','true');document.body.classList.remove('preview-open');}
document.addEventListener('DOMContentLoaded',()=>{showStart('art1','startWrap1');showStart('art2','startWrap2');$('make').addEventListener('click',make);$('closePreview').addEventListener('click',closePreview);$('previewModal').addEventListener('click',e=>{if(e.target===$('previewModal'))closePreview();});$('print').addEventListener('click',()=>window.print());});
</script>
