<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pokalschießen</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>🎯 Pokalschießen</h1><p>Schießzettel erstellen</p></header><main>
<section class="card"><h2>Neue Mannschaft</h2>
<label>Verein<input id="verein" placeholder="z. B. Badenstedt"></label>
<div class="grid"><label>Mannschaft<select id="mannschaft"><option>Herren</option><option>Damen</option></select></label><label>Telefon<input id="telefon" type="tel" inputmode="tel"></label></div>
<div class="sets"><h3>Satz 1</h3><label>Schießart<select id="art1"><option value="">Bitte auswählen</option><option>Sandsack</option><option>Nagel</option></select></label><div id="startWrap1" class="hidden"><label>Erste Scheibennummer für Satz 1<input id="start1" type="number" inputmode="numeric" placeholder="z. B. 21346" min="1"></label></div>
<h3>Satz 2</h3><label>Schießart<select id="art2"><option value="">Bitte auswählen</option><option>Sandsack</option><option>Nagel</option></select></label><div id="startWrap2" class="hidden"><label>Erste Scheibennummer für Satz 2<input id="start2" type="number" inputmode="numeric" placeholder="z. B. 21800" min="1"></label></div>
<p class="hint">Nach Auswahl der Schießart erscheint automatisch die passende Eingabe für die erste Scheibennummer.</p></div>
<button id="make">Schießzettel fertigstellen</button></section>
<section class="card preview-card">
  <div class="actions">
    <h2>Vorschau</h2>
    <button id="openPreview" disabled>Vorschau öffnen</button>
  </div>
</section>

<div id="previewModal" class="preview-modal hidden" role="dialog" aria-modal="true" aria-label="Vorschau">
  <div class="preview-window">
    <div class="preview-toolbar">
      <strong>Pokalschießen – Vorschau</strong>
      <div class="preview-actions">
        <button id="print" type="button">🖨️ Drucken</button>
        <button id="closePreview" type="button" class="close-btn">Schließen</button>
      </div>
    </div>
    <div class="preview-content">
      <div id="out"></div>
    </div>
  </div>
</div>
</main><script src="script.js"></script></body></html>
