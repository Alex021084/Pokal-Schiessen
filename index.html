<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pokalschießen</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f1f2f4;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:#1d1f22;color:#fff;padding:20px 16px;text-align:center} header h1{margin:0;font-size:27px} header p{margin:4px 0 0;opacity:.8}
main{max-width:760px;margin:auto;padding:16px} .card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 3px 15px #0001}
label{display:block;font-weight:650;margin:12px 0} input,select{width:100%;min-height:48px;margin-top:7px;padding:10px 12px;border:1px solid #c9c9c9;border-radius:10px;background:#fff;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px} .sets{margin-top:10px;padding:16px;border:1px solid #ddd;border-radius:14px;background:#fafafa} .sets h3{margin:8px 0 2px}
button{min-height:50px;border:0;border-radius:11px;padding:0 18px;font-size:17px;font-weight:700;background:#438f46;color:#fff} #make{width:100%;margin-top:14px}
.hidden{display:none!important} .preview-modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;flex-direction:column} .preview-toolbar{background:#1d1f22;color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px} .preview-actions{display:flex;gap:8px} .preview-actions button{min-height:44px;font-size:15px} .close-btn{background:#505257}
.preview-content{flex:1;overflow:auto;padding:16px 8px} #out{width:100%;margin:auto;display:flex;justify-content:center} .sheet{width:1452px;height:2054px;background:#fff;position:relative;overflow:hidden;transform-origin:top center;flex:0 0 1452px}
.template{position:absolute;inset:0;width:1452px;height:2054px;z-index:1} .dyn{position:absolute;z-index:3;color:#111;white-space:nowrap} .value{font-size:22px;line-height:1.05} .heading{font-size:27px;font-weight:800;line-height:1} .kind{font-size:27px;font-weight:800;line-height:1} .smallnum{font-size:18px;line-height:1;text-align:center}
@media(max-width:700px){.grid{grid-template-columns:1fr} .preview-content{padding:8px 0} .preview-actions button{padding:0 12px;font-size:14px}}
@media print{@page{size:A4 portrait;margin:0} html,body{margin:0!important;background:#fff!important} header,.card,.preview-toolbar{display:none!important} main,.preview-modal,.preview-content,#out{display:block!important;margin:0!important;padding:0!important;width:auto!important;height:auto!important;overflow:visible!important;background:#fff!important} .sheet{width:1452px!important;height:2054px!important;transform:none!important;zoom:calc(210 / 1452 * 1px) !important;box-shadow:none!important}}
</style></head><body>
<header><h1>🎯 Pokalschießen</h1><p>Schießzettel erstellen</p></header><main><section class="card"><h2>Schießzettel</h2>

<h3>Satz 2</h3><label>Schießart<select id="art2"><option value="">Bitte auswählen</option><option>Sandsack</option><option>Nagel</option></select></label><label>Erste Scheibennummer für Satz 2<input id="start2" type="number" inputmode="numeric" min="1"></label></div>
<button id="make" type="button">Schießzettel erstellen</button></section></main>

function text(x,y,cls,txt,extra=''){return `<div class="dyn ${cls}" style="left:${x}px;top:${y}px;${extra}">${esc(txt)}</div>`}
function center(x,y,w,cls,txt){return `<div class="dyn ${cls}" style="left:${x}px;top:${y}px;width:${w}px">${esc(txt)}</div>`}
function render(){
 const verein=$('verein').value.trim(), telefon=$('telefon').value.trim(), m=$('mannschaft').value, a1=$('art1').value, a2=$('art2').value;
 const s1=Number($('start1').value), s2=Number($('start2').value);
 if(!verein||!telefon||!a1||!a2||!Number.isInteger(s1)||!Number.isInteger(s2)||s1<1||s2<1){alert('Bitte Verein, Telefon sowie beide Schießarten und die ersten Scheibennummern eingeben.');return;}
 const n1=[s1,s1+1,s1+2], n2=[s2,s2+1,s2+2];
 let o=`<article class="sheet"><img class="template" src="${IMG}" alt="Druckvorlage">`;
 // Exact supplied PDF remains the background. Values are overlaid only in the intended blank areas.
 o+=text(220,329,'value',verein);
 o+=text(620,329,'value',telefon);
 o+=text(66,304,'heading',m); o+=text(66,333,'kind',a1);
 o+=text(66,786,'heading',m); o+=text(66,815,'kind',a2);
 [424,473,522].forEach((y,i)=>o+=center(1315,y,95,'smallnum',n1[i]));
 [905,954,1003].forEach((y,i)=>o+=center(1315,y,95,'smallnum',n2[i]));
 o+=center(1315,675,95,'smallnum',s1+3);
 o+=center(1315,1160,95,'smallnum',s2+3);
 o+='</article>'; $('out').innerHTML=o; $('previewModal').classList.remove('hidden'); document.body.style.overflow='hidden'; fit(); }
function fit(){const c=document.querySelector('.preview-content'),s=document.querySelector('.sheet'); if(!c||!s)return; const scale=Math.min((c.clientWidth-8)/1452,(c.clientHeight-8)/2054,1); s.style.transform=`scale(${scale})`; document.getElementById('out').style.height=(2054*scale)+'px';}
window.addEventListener('resize',fit); $('make').addEventListener('click',render); $('close').addEventListener('click',()=>{$('previewModal').classList.add('hidden');document.body.style.overflow=''}); $('print').addEventListener('click',()=>window.print());
</script></body></html>
