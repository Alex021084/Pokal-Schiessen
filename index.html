<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokalschießen</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>🎯 Pokalschießen</h1><p>Schießzettel erstellen</p></header>
<main>
<section class="card">
<h2>Neue Mannschaft</h2>
<label>Verein<input id="verein" placeholder="z. B. Badenstedt"></label>
<div class="grid">
<label>Mannschaft<select id="mannschaft"><option>Herren</option><option>Damen</option></select></label>
<label>Telefon<input id="telefon" type="tel" inputmode="tel"></label>
</div>
<div class="sets">
<h3>Satz 1</h3>
<div class="set"><label>Schießart<select id="art1"><option>Sandsack</option><option>Nagel</option></select></label>
<label>Erste Scheibennummer<input id="start1" type="number" inputmode="numeric" value="21346"></label></div>
<h3>Satz 2</h3>
<div class="set"><label>Schießart<select id="art2"><option>Nagel</option><option>Sandsack</option></select></label>
<label>Erste Scheibennummer<input id="start2" type="number" inputmode="numeric" value="21350"></label></div>
<p class="hint">Die Nummern werden innerhalb jedes Satzes automatisch fortlaufend vergeben: 3 Schützenscheiben + 1 Teilerscheibe.</p>
</div>
<button id="make">Vorschau erstellen</button>
</section>
<section class="card"><div class="actions"><h2>Vorschau</h2><button id="print">🖨️ Drucken</button></div><div id="out"></div></section>
</main><script src="script.js"></script></body></html>
