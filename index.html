<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pokalschießen</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f2f4;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:#1d1f22;color:#fff;padding:20px 16px;text-align:center}
header h1{margin:0;font-size:27px} header p{margin:4px 0 0;opacity:.8}
main{max-width:760px;margin:auto;padding:16px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 3px 15px #0001}
label{display:block;font-weight:650;margin:12px 0}
input,select{width:100%;min-height:48px;margin-top:7px;padding:10px 12px;border:1px solid #c9c9c9;border-radius:10px;background:#fff;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sets{margin-top:10px;padding:16px;border:1px solid #ddd;border-radius:14px;background:#fafafa}
.sets h3{margin:8px 0 2px}
button{min-height:50px;border:0;border-radius:11px;padding:0 18px;font-size:17px;font-weight:700;background:#438f46;color:#fff}
#make{width:100%;margin-top:14px}
.hidden{display:none!important}
.preview-modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;flex-direction:column}
.preview-toolbar{background:#1d1f22;color:#fff;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.preview-actions{display:flex;gap:8px}
.preview-actions button{min-height:44px;font-size:15px}
.close-btn{background:#505257}
.preview-content{flex:1;overflow:auto;padding:16px 8px}
#out{width:210mm;max-width:100%;margin:auto;display:flex;justify-content:center}
#out .sheet{flex:0 0 210mm}
.sheet{width:210mm;height:297mm;background:#fff;position:relative;overflow:hidden;margin:0;box-shadow:0 2px 10px #0002;transform-origin:top center}
.template{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:1}.mask{z-index:2}.dyn{z-index:3}
.mask{position:absolute;background:#fff}
.dyn{position:absolute;white-space:nowrap;color:#111}
.center{transform:translateX(-50%);text-align:center}
.smallnum{font-size:3.7mm;line-height:1}
.meta{font-size:4mm;line-height:1.35}
.value{font-size:4.5mm}
.heading{font-size:7.4mm;font-weight:800;line-height:1}
.kind{font-size:6.4mm;font-weight:800;line-height:1}
@media(max-width:700px){
 .grid{grid-template-columns:1fr}
 .preview-content{padding:8px 0}
 .preview-actions button{padding:0 12px;font-size:14px}
 #out{width:100%;overflow:hidden}
 #out .sheet{transform-origin:top center;transform:scale(calc((100vw - 8px) / 793.7008));margin-bottom:calc(-297mm + (297mm * ((100vw - 8px) / 793.7008)))}
}
@media print{
 @page{size:A4 portrait;margin:0}
 html,body{margin:0!important;background:#fff!important}
 header,.card,.preview-toolbar{display:none!important}
 main,.preview-modal,.preview-content,#out{display:block!important;margin:0!important;padding:0!important;width:auto!important;max-width:none!important;height:auto!important;overflow:visible!important;background:#fff!important}
 .sheet{width:210mm!important;height:297mm!important;margin:0!important;box-shadow:none!important}
}
</style>
</head>
<body>
<header><h1>🎯 Pokalschießen</h1><p>Schießzettel erstellen</p></header>
<main>
<section class="card">
<h2>Schießzettel</h2>
<label>Verein<input id="verein" placeholder="z. B. Badenstedt"></label>
<div class="grid">
<label>Geschlecht<select id="mannschaft"><option>Herren</option><option>Damen</option></select></label>
<label>Telefon<input id="telefon" type="tel" inputmode="tel"></label>
</div>
<div class="sets">
<h3>Satz 1</h3>
<label>Schießart<select id="art1"><option value="">Bitte auswählen</option><option>Sandsack</option><option>Nagel</option></select></label>
<label>Erste Scheibennummer für Satz 1<input id="start1" type="number" inputmode="numeric" min="1"></label>
<h3>Satz 2</h3>
<label>Schießart<select id="art2"><option value="">Bitte auswählen</option><option>Sandsack</option><option>Nagel</option></select></label>
<label>Erste Scheibennummer für Satz 2<input id="start2" type="number" inputmode="numeric" min="1"></label>
</div>
<button id="make" type="button">Schießzettel erstellen</button>
</section>
</main>

<div id="previewModal" class="preview-modal hidden" aria-hidden="true">
<div class="preview-toolbar"><strong>Pokalschießen – Vorschau</strong>
<div class="preview-actions"><button id="print">🖨️ Drucken</button><button id="close" class="close-btn">Schließen</button></div>
</div>
<div class="preview-content"><div id="out"></div></div>
</div>

function fitPreview(){
 const modal=$('previewModal'), out=$('out'), sheet=out?.querySelector('.sheet');
 if(!sheet || modal.classList.contains('hidden')) return;
 const content=modal.querySelector('.preview-content');
 const usableW=Math.max(1, content.clientWidth-16);
 const usableH=Math.max(1, content.clientHeight-16);
 const sheetW=793.7008, sheetH=1122.5197; // A4 at 96dpi
 const scale=Math.min(usableW/sheetW, usableH/sheetH, 1);
 sheet.style.transform=`scale(${scale})`;
 out.style.width=(sheetW*scale)+'px';
 out.style.height=(sheetH*scale)+'px';
}
window.addEventListener('resize',fitPreview);

$('make').addEventListener('click',render);
$('close').addEventListener('click',()=>{ $('previewModal').classList.add('hidden'); $('previewModal').setAttribute('aria-hidden','true'); document.body.style.overflow=''; });
